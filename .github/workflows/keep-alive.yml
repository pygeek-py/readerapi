name: Keep Render services warm

# Quoted because an unquoted `on:` is parsed as the boolean `true` by PyYAML
# (a common gotcha for tools that lint/parse this file with Python); GitHub's
# own workflow parser accepts the quoted form the same as the unquoted one.
"on":
  schedule:
    # Render's free tier spins a service down after ~15 minutes idle, and the
    # Neon Postgres database suspends on its own, separate idle timer that can
    # be even shorter. Every 5 minutes keeps both comfortably below either.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend + database (readerapi)
        run: |
          curl -sf --max-time 25 https://readerapi.onrender.com/readyz/ \
            || echo "Backend/DB ping failed or timed out (likely mid cold-start) - not fatal."

      - name: Ping frontend (reader)
        run: |
          curl -sf --max-time 25 https://reader-pjxs.onrender.com/ \
            || echo "Frontend ping failed or timed out (likely mid cold-start) - not fatal."
